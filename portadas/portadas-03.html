<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Portadas de los reels del lote 3</title>
<link rel="stylesheet" href="../motor/fuentes.css">
<link rel="stylesheet" href="../motor/carrusel.css">
<link rel="stylesheet" href="../motor/tv.css">
<style>
/* Las portadas de los cinco reels (1080×1920). La cuadrícula del perfil enseña el centro en 3:4
   (de y=240 a y=1680): el titular va de 300 a 700 y debajo, un fotograma del propio reel, bajado
   para que su titular quede tapado por el velo. Se regeneran con
   python3 motor/carrusel.py portadas/portadas-03.html salida/pc 1920 (y se copian a instagram/lote-03/portada-r6.jpg y portada-r7.jpg) */
.dia{height:1920px;padding:0}
.foto{position:absolute;left:0;width:1080px;height:1920px;z-index:0}
.velo{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,var(--fondo) 0,var(--fondo) var(--solido,730px),rgba(6,8,11,0) calc(var(--solido,730px) + 70px),rgba(6,8,11,0) 1560px,rgba(6,8,11,.85) 1800px)}
.arriba{position:absolute;z-index:2;left:80px;right:80px;top:380px}
.arriba .logo-p{font-size:44px;margin-bottom:38px}
.arriba .rotulo{display:flex;margin:0 0 22px}
.arriba .titular{font-size:138px;line-height:.94}
.arriba .tv-bug{position:relative;left:auto;top:auto;width:max-content;margin-bottom:40px;animation:none}
.arriba .tv-narra{position:static;margin:0;font-size:150px;line-height:1.02}
</style></head>
<body>
<section class="dia">
  <img class="foto" src="fotogramas/r6-quien-te-debe.png" style="top:420px" alt="">
  <div class="velo"></div>
  <div class="arriba"><h1 class="tv-narra">¿Quién te<br><span class="v">ha pagado?</span></h1></div>
</section>

<section class="dia">
  <img class="foto" src="fotogramas/r7-sin-cobertura.png" style="top:20px" alt="">
  <div class="velo"></div>
  <div class="arriba"><h1 class="tv-narra">Funciona<br><span class="v">sin red.</span></h1></div>
</section>
</body></html>
